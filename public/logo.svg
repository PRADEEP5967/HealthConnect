<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5a5"/>
      <stop offset="100%" stop-color="#087f7f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0fdfd" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner glow ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Heart pulse line -->
  <path d="M 96 256 L 180 256 L 210 176 L 250 336 L 285 224 L 310 256 L 416 256"
        fill="none"
        stroke="url(#pulse)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Small medical cross accent -->
  <g transform="translate(372, 140)" opacity="0.9">
    <rect x="0" y="14" width="44" height="14" rx="4" fill="#ffffff"/>
    <rect x="15" y="0" width="14" height="44" rx="4" fill="#ffffff"/>
  </g>
</svg>
